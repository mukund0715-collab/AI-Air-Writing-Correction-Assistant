{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}GestuRite – AI Air Writing{% endblock %}</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #0f0f14;
            color: white;
            font-family: 'Poppins', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body class="text-white">

    <!-- NAVBAR -->
    <nav class="w-full py-5 px-10 flex justify-between items-center glass fixed top-0 left-0 z-50">
        <h1 class="text-2xl font-bold tracking-wide">
            Gestu<span class="text-blue-400">Rite</span>
        </h1>

        <div class="space-x-6 text-lg">
            <a href="{% url 'home' %}" class="hover:text-blue-400 transition">Home</a>
            <a href="{% url 'saved_files' %}" class="hover:text-blue-400 transition">Saved Documents</a>
        </div>
    </nav>

    <!-- BODY CONTENT -->
    <main class="pt-28">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="mt-20 mb-10 text-center opacity-70 text-sm">
        &copy; 2025 GestuRite — AI Powered Air Writing System
    </footer>

    {% block extra_scripts %}
    {% endblock %}
</body>
</html>
