{% extends "painter/base.html" %}
{% block content %}

<div class="max-w-lg mx-auto mt-20 bg-slate-900 p-8 rounded-xl shadow-xl">

    <h1 class="text-3xl font-bold text-white mb-6">Rename File</h1>

    <form method="POST">
        {% csrf_token %}

        <label class="block text-slate-300 text-lg mb-2">New File Name</label>
        <input type="text" name="new_name"
               value="{{ file.filename }}"
               class="w-full p-3 rounded-lg bg-slate-800 text-white border border-slate-700 mb-6"
               required>

        <div class="flex space-x-4">
            <button class="bg-yellow-500 hover:bg-yellow-600 text-black py-2 px-6 rounded-lg">
                Save
            </button>

            <a href="{% url 'saved_files' %}"
               class="bg-slate-700 hover:bg-slate-600 text-white py-2 px-6 rounded-lg">
                Cancel
            </a>
        </div>
    </form>

</div>

{% endblock %}
