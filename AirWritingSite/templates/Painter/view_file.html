{% extends "painter/base.html" %}
{% block content %}

<div class="max-w-4xl mx-auto mt-12">

    <h1 class="text-3xl font-bold text-white mb-4">{{ file.filename }}</h1>

    <div class="bg-slate-900 p-6 rounded-xl shadow-lg text-white whitespace-pre-line leading-7">
        {{ file.content }}
    </div>

    <div class="mt-8 flex space-x-4">
        <a href="{% url 'download_file' file.id %}"
           class="bg-green-600 hover:bg-green-700 text-white py-2 px-6 rounded-lg">
            Download
        </a>
    </div>

</div>
{% endblock %}
